[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leonida-v"
version = "1.0.0"
description = "Leonida V: a guided installer kit that turns GTA V Enhanced into a GTA VI-style experience (story mode only)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mihail Georgiev (JacobJandon)" }]
keywords = ["gta5", "gta-v-enhanced", "modding", "mod-manager", "installer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
# Windows exe: pip install -e ".[gui,build]" then python build/build_exe.py (see build/leonida.spec)
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
leonida = "leonida.cli:main"

[project.gui-scripts]
leonida-gui = "leonida.gui.app:main"

[tool.setuptools.packages.find]
include = ["leonida*"]

[tool.setuptools.package-data]
"leonida.manifest" = ["*.json"]
"leonida.gui" = ["assets/*", "assets/fonts/*"]
"leonida.probe" = ["*.cs"]
"leonida.menu" = ["*.cs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the repo root on sys.path, so plain `pytest` (CI) imports `tests.*` and `build.*` the same as `python -m pytest`
pythonpath = ["."]
# keep only the last run's temp folders, and only those of failed tests (several sessions run the suite on one PC)
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
  "e2e: real-file install test on real downloaded archives (needs LEONIDA_E2E_DOWNLOADS; skipped otherwise)",
  "webengine: tests that start QtWebEngine (Leonida's built-in browser); slow, deselect with -m 'not webengine'",
]

[tool.coverage.run]
source = ["leonida"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
ignore = ["SIM112"]
