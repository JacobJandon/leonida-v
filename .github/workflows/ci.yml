name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  # Pull requests, from forks too: GitHub gives them a read-only GITHUB_TOKEN and no secrets, which is all the test
  # job needs (it uses no secrets). windows-build (contents: write) never runs for a pull request.
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Build the Windows folder and publish a GitHub release (draft pre-release unless run on a v* tag)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      LEONIDA_NO_NET: "1"
      LEONIDA_NO_OPEN: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu  # the webengine tests: runners have no GPU
      QTWEBENGINE_DISABLE_SANDBOX: "1"           # Chromium's sandbox can't start in the Linux runner container
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libgl1 libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - run: pip install -e ".[dev,gui]"
      - run: ruff check .
      - name: Tests + coverage
        # Coverage gate (90% of leonida/ lines) on Windows only: the Windows-only branches (registry, ctypes exe
        # version, os.startfile, PowerShell GPU query) are skipif'd on Linux, so Linux reports lower on purpose.
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then gate=--cov-fail-under=90; else gate=; fi
          pytest -q --cov=leonida --cov-report=term $gate

  windows-build:
    # Runs for v* tags and for a manual run with "release" ticked.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write  # create the release and upload its assets
    env:
      LEONIDA_NO_OPEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[gui,build]"
      - name: Version
        id: ver
        shell: bash
        run: |
          ver=$(python -c "import leonida; print(leonida.__version__)")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$ver" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match leonida.__version__ $ver"; exit 1
          fi
      - name: Check release/modpack.json
        # build_exe.py --release runs the same check; this step just fails fast before the 5-minute build.
        # No modpack.json -> notice only; the release goes out without it.
        shell: bash
        run: |
          if [[ ! -f release/modpack.json ]]; then
            echo "::notice::release/modpack.json not found: releasing without modpack.json"
            exit 0
          fi
          python -c "from leonida.modpack import load_file; import json,sys; d=load_file('release/modpack.json'); m=json.load(open('leonida/manifest/mods.json',encoding='utf-8')); sys.exit(0 if d['version']==m['version'] else 'modpack.json was built with another mods.json version')"
      - name: Build, self-check and zip
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu  # runners have no GPU; only affects the self-check run
        # Writes dist/release-assets.txt: the win64 zip, the source zip, Leonida-V-Setup-<ver>.exe, modpack.json (if
        # any) and SHA256SUMS.txt. Mod files and CodeWalker files are never assets (build_exe.py refuses them).
        # The same steps run locally with: python build/release_dryrun.py
        run: python build/build_exe.py --selftest --release
      - name: Setup smoke test
        # The real setup, silently: install for this user into a temp folder (own registry root, own shortcut
        # folders), start the installed CLI, uninstall. Never touches the runner's real Start menu or registry.
        run: python build/e2e_setup.py --smoke dist
      - name: Check release assets (checksums, setup payload, no CodeWalker files)
        # Fails the job when an asset is missing or extra, a checksum is wrong, the setup doesn't carry the released
        # win64 zip, or any CodeWalker file (CodeWalker.Core.dll, SharpDX, a built LeonidaRpf.exe, CodeWalker's
        # source) is in a zip, in the setup exe or in the zip inside it. Leonida never ships CodeWalker: the app
        # fetches dexyfex's source at first use (leonida/cwtools.py).
        run: python build/check_release.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: leonida-v-${{ steps.ver.outputs.version }}-windows
          path: |
            dist/Leonida-V-Setup-*.exe
            dist/LeonidaV-*-win64.zip
            dist/leonida-v-*.zip
            dist/modpack.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v$VERSION"
          # Notes: docs/RELEASE-NOTES-<x.y.z>.md for x.y.z and its pre-releases (1.0.1rc1 -> 1.0.1), else generated.
          base="${VERSION%%[a-zA-Z]*}"; base="${base%.}"
          notes="docs/RELEASE-NOTES-$base.md"
          flags=(--title "Leonida V $VERSION")
          if [[ -f "$notes" ]]; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            flags+=(--draft --prerelease --target "$GITHUB_SHA")
          elif [[ "$VERSION" =~ (dev|a|b|rc)[0-9]*$ ]]; then
            flags+=(--prerelease)  # the updater's stable channel (releases/latest) skips these
          else
            flags+=(--latest)      # what installed copies find through releases/latest
          fi
          mapfile -t assets < dist/release-assets.txt
          echo "Uploading: ${assets[*]}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" "${flags[@]}"
          fi
