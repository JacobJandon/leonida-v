name: Feature request
description: An idea for the launcher, the in-game menu, a pack, or the docs.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Not sure yet, or want to talk it through first? Start a thread in
        [Discussions](https://github.com/JacobJandon/leonida-v/discussions) → Ideas.
  - type: textarea
    id: problem
    attributes:
      label: What would it solve?
      description: What you were trying to do and what got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Mock-ups and screenshots welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Launcher (GUI)
        - Command line
        - In-game menu (LeonidaMenu)
        - Packs, add-ons and mods
        - Setup / updates
        - Docs
        - Other
  - type: checkboxes
    id: help
    attributes:
      label: Help
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md).
